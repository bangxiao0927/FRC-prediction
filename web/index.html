<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRC Prediction Dashboard</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <header>
      <h1>FRC Prediction Dashboard</h1>
    </header>

    <section class="controls" aria-label="Prediction controls">
      <label>
        Event
        <input id="eventKey" type="text" value="2024casj" autocomplete="off" />
      </label>
      <label>
        Match
        <input id="matchKey" type="text" placeholder="upcoming · or 3 / qm3 / sf2m1" autocomplete="off" />
      </label>
      <label>
        Top
        <input id="topCount" type="number" min="1" max="100" value="20" />
      </label>
      <button id="runPrediction">Run</button>
      <button id="refresh" type="button">Refresh files</button>
      <label class="auto-refresh">
        <input id="autoRefresh" type="checkbox" />
        Auto
      </label>
      <label>
        Every
        <select id="autoInterval">
          <option value="15">15s</option>
          <option value="30" selected>30s</option>
          <option value="60">60s</option>
          <option value="120">2m</option>
        </select>
      </label>
      <span id="status" role="status"></span>
    </section>

    <section id="errorPanel" class="error-panel" hidden></section>

    <section id="predictionPanel" class="prediction-panel" hidden>
      <div class="prediction-head">
        <h2>Prediction</h2>
        <span id="matchLabel" class="match-tag">--</span>
      </div>

      <div class="winbar" role="img" aria-label="Win probability">
        <div id="winbarRed" class="winbar-seg red" style="width: 50%">
          <span id="redWin">--</span>
        </div>
        <div id="winbarBlue" class="winbar-seg blue" style="width: 50%">
          <span id="blueWin">--</span>
        </div>
      </div>
      <p id="winnerCallout" class="winner-callout">--</p>

      <div class="compare">
        <div class="compare-side red">
          <h3>Red Alliance</h3>
          <p id="redTeams" class="teams"></p>
        </div>
        <div class="compare-side blue">
          <h3>Blue Alliance</h3>
          <p id="blueTeams" class="teams"></p>
        </div>

        <div class="metric">
          <span class="m-red" id="redEstimate">--</span>
          <span class="m-label">Est. Score</span>
          <span class="m-blue" id="blueEstimate">--</span>
        </div>
        <div class="metric">
          <span class="m-red" id="redWinMetric">--</span>
          <span class="m-label">Win Prob</span>
          <span class="m-blue" id="blueWinMetric">--</span>
        </div>
        <div class="metric">
          <span class="m-red" id="redConfidence">--</span>
          <span class="m-label">Confidence</span>
          <span class="m-blue" id="blueConfidence">--</span>
        </div>
        <div class="metric">
          <span class="m-red" id="redMatches">--</span>
          <span class="m-label">Avg Matches</span>
          <span class="m-blue" id="blueMatches">--</span>
        </div>
      </div>
    </section>

    <section>
      <h2>Team Stats</h2>
      <p id="matchTeams" class="match-teams" hidden></p>
      <div class="chart-container">
        <canvas id="statsChart"></canvas>
      </div>
      <table id="statsTable">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Team</th>
            <th>Matches</th>
            <th>Total</th>
            <th>Average</th>
            <th>Event Avg</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section>
      <h2>Picklist</h2>
      <div class="controls" aria-label="Picklist controls">
        <label>
          Your Team
          <input id="picklistTeam" type="text" placeholder="frc254" autocomplete="off" />
        </label>
        <label>
          Strategy
          <select id="picklistStrategy">
            <option value="balanced" selected>Balanced</option>
            <option value="offense">Offense</option>
            <option value="consistency">Consistency</option>
          </select>
        </label>
        <label>
          Exclude
          <input id="picklistExclude" type="text" placeholder="e.g. 1678, 254" autocomplete="off" />
        </label>
        <label>
          Top
          <input id="picklistTop" type="number" min="1" max="100" value="24" />
        </label>
        <button id="buildPicklist" type="button">Build picklist</button>
        <span id="picklistStatus" role="status"></span>
      </div>
      <p id="picklistSelf" class="match-teams" hidden></p>
      <div class="chart-container">
        <canvas id="picklistChart"></canvas>
      </div>
      <table id="picklistTable">
        <thead>
          <tr>
            <th>Rank</th>
            <th>Team</th>
            <th>Score</th>
            <th>Average</th>
            <th>Std Dev</th>
            <th>Trend</th>
            <th>Matches</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <script src="/assets/app.js"></script>
  </body>
</html>
